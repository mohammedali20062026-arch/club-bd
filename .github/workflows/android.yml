name: Build Club BD APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          test -f club-bd-fixed-2.zip || { echo "club-bd-fixed-2.zip not found in repo root"; ls -la; exit 1; }
          mkdir project
          unzip -q club-bd-fixed-2.zip -d project
          if [ ! -f project/settings.gradle.kts ]; then
            d=$(dirname "$(find project -name settings.gradle.kts | head -1)")
            echo "PROJECT_DIR=$d" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare keystore and env
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Club BD,O=Club BD,C=BD"
          fi
          cp .env.example .env

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp "$PROJECT_DIR"/app/build/outputs/apk/debug/app-debug.apk club-bd.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: club-bd-debug-apk
          path: club-bd.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Club BD build ${{ github.run_number }}
          files: club-bd.apk
